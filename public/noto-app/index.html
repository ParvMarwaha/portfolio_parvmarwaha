    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f3" />
    <script>
      // Apply the saved/system theme before first paint so the page never flashes the wrong colours.
      (function () {
        try {
          var v = localStorage.getItem("noto_theme");
          var dark = v === "dark" || (v !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", dark ? "#0b0b0c" : "#f6f6f3");
        } catch (e) {}
      })();
    </script>
